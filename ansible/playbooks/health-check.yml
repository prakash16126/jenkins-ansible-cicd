---
- name: Verify Netflix Application
  hosts: dev

  tasks:

    - name: Check Netflix application
      uri:
        url: http://localhost:8080/NETFLIX/
        status_code: 200
      register: application_response
      retries: 10
      delay: 5
      until: application_response.status == 200

    - name: Display application status
      debug:
        msg: "Netflix application is responding successfully"
