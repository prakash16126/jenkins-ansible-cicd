---
- name: Install and Configure Tomcat
  hosts: dev
  become: true

  vars:
    tomcat_version: "10.1.44"
    tomcat_user: "tomcat"
    tomcat_group: "tomcat"
    tomcat_home: "/opt/tomcat"

    tomcat_archive: "apache-tomcat-{{ tomcat_version }}.tar.gz"

    tomcat_url: "https://archive.apache.org/dist/tomcat/tomcat-10/v{{ tomcat_version }}/bin/{{ tomcat_archive }}"

  tasks:

    # --------------------------------------------------
    # 1. Install Java
    # --------------------------------------------------

    - name: Install Java
      apt:
        name: openjdk-17-jdk
        state: present
        update_cache: true


    # --------------------------------------------------
    # 2. Install required packages
    # --------------------------------------------------

    - name: Install required packages
      apt:
        name:
          - wget
          - tar
        state: present


    # --------------------------------------------------
    # 3. Create Tomcat group
    # --------------------------------------------------

    - name: Create Tomcat group
      group:
        name: "{{ tomcat_group }}"
        state: present


    # --------------------------------------------------
    # 4. Create Tomcat user
    # --------------------------------------------------

    - name: Create Tomcat user
      user:
        name: "{{ tomcat_user }}"
        group: "{{ tomcat_group }}"
        home: "{{ tomcat_home }}"
        shell: /bin/false
        system: true
        create_home: false


    # --------------------------------------------------
    # 5. Create Tomcat installation directory
    # --------------------------------------------------

    - name: Create Tomcat directory
      file:
        path: "{{ tomcat_home }}"
        state: directory
        owner: "{{ tomcat_user }}"
        group: "{{ tomcat_group }}"
        mode: "0755"


    # --------------------------------------------------
    # 6. Download Tomcat
    # --------------------------------------------------

    - name: Download Tomcat
      get_url:
        url: "{{ tomcat_url }}"
        dest: "/tmp/{{ tomcat_archive }}"
        mode: "0644"


    # --------------------------------------------------
    # 7. Extract Tomcat
    # --------------------------------------------------

    - name: Extract Tomcat
      unarchive:
        src: "/tmp/{{ tomcat_archive }}"
        dest: "{{ tomcat_home }}"
        remote_src: true
        extra_opts:
          - "--strip-components=1"


    # --------------------------------------------------
    # 8. Set Tomcat ownership
    # --------------------------------------------------

    - name: Set ownership of Tomcat directory
      file:
        path: "{{ tomcat_home }}"
        owner: "{{ tomcat_user }}"
        group: "{{ tomcat_group }}"
        recurse: true


    # --------------------------------------------------
    # 9. Set executable permissions
    # --------------------------------------------------

    - name: Set execute permissions on Tomcat scripts
      file:
        path: "{{ tomcat_home }}/bin"
        owner: "{{ tomcat_user }}"
        group: "{{ tomcat_group }}"
        mode: "0755"
        recurse: true


    # --------------------------------------------------
    # 10. Determine JAVA_HOME
    # --------------------------------------------------

    - name: Determine JAVA_HOME
      shell: |
        dirname $(dirname $(readlink -f $(which java)))
      register: java_home_result
      changed_when: false


    # --------------------------------------------------
    # 11. Create systemd service
    # --------------------------------------------------

    - name: Create Tomcat systemd service
      copy:
        dest: /etc/systemd/system/tomcat.service
        mode: "0644"
        content: |
          [Unit]
          Description=Apache Tomcat
          After=network.target

          [Service]
          Type=forking

          User={{ tomcat_user }}
          Group={{ tomcat_group }}

          Environment="JAVA_HOME={{ java_home_result.stdout }}"
          Environment="CATALINA_HOME={{ tomcat_home }}"
          Environment="CATALINA_BASE={{ tomcat_home }}"

          ExecStart={{ tomcat_home }}/bin/startup.sh
          ExecStop={{ tomcat_home }}/bin/shutdown.sh

          Restart=on-failure

          [Install]
          WantedBy=multi-user.target


    # --------------------------------------------------
    # 12. Reload systemd
    # --------------------------------------------------

    - name: Reload systemd
      systemd:
        daemon_reload: true


    # --------------------------------------------------
    # 13. Start Tomcat
    # --------------------------------------------------

    - name: Start Tomcat
      systemd:
        name: tomcat
        state: started


    # --------------------------------------------------
    # 14. Enable Tomcat at boot
    # --------------------------------------------------

    - name: Enable Tomcat
      systemd:
        name: tomcat
        enabled: true


    # --------------------------------------------------
    # 15. Verify Tomcat is running
    # --------------------------------------------------

    - name: Check Tomcat service status
      command: systemctl is-active tomcat
      register: tomcat_status
      changed_when: false

    - name: Display Tomcat status
      debug:
        msg: "Tomcat status: {{ tomcat_status.stdout }}"
